<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="360" height="320" viewBox="0 0 100 86.6">

  <defs>
    <!-- Vertex->black gradients, each pointing toward the opposite edge -->
    <linearGradient id="fadeA" gradientUnits="userSpaceOnUse"
                    x1="50" y1="0" x2="50" y2="86.6">
      <stop offset="0%"   stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="fadeB" gradientUnits="userSpaceOnUse"
                    x1="0" y1="86.6" x2="75" y2="43.3">
      <stop offset="0%"   stop-color="#00ff00"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="fadeC" gradientUnits="userSpaceOnUse"
                    x1="100" y1="86.6" x2="25" y2="43.3">
      <stop offset="0%"   stop-color="#0000ff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Same triangle path, reused as “images” inside the filter -->
    <path id="triA" d="M 50,0 L 0,86.6 L 100,86.6 Z" fill="url(#fadeA)"/>
    <path id="triB" d="M 50,0 L 0,86.6 L 100,86.6 Z" fill="url(#fadeB)"/>
    <path id="triC" d="M 50,0 L 0,86.6 L 100,86.6 Z" fill="url(#fadeC)"/>

    <!-- Add the 3 layers together -->
    <filter id="gouraudAdd"
            x="0" y="0" width="100" height="86.6"
            filterUnits="userSpaceOnUse"
            color-interpolation-filters="linearRGB">
      <feImage xlink:href="#triA" result="A"/>
      <feImage xlink:href="#triB" result="B"/>
      <feImage xlink:href="#triC" result="C"/>

      <!-- A + B -->
      <feComposite in="A" in2="B" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0" result="AB"/>

      <!-- (A + B) + C -->
      <feComposite in="AB" in2="C" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0" result="ABC"/>

      <feComposite in="ABC" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Apply filter to any one of the triangle layers -->
  <use xlink:href="#triC" filter="url(#gouraudAdd)"/>
</svg>
