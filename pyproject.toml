[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "phasor-docs-site"
version = "0.1.0"
description = "Static docs site generator for the phasor engine docs."
readme = "tools/docs_site/README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0"
]

[project.scripts]
phasor-docs-site = "phasor_docs_site.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools/docs_site/src/phasor_docs_site"]

[tool.hatch.build.targets.sdist]
include = [
  "tools/docs_site/src/phasor_docs_site",
  "tools/docs_site/README.md",
  "docs",
  "build.zig",
  "build_examples.zig",
  "examples.zig",
  "examples",
  "src",
  "lib"
]

[tool.uv]
package = true

[tool.pyright]
include = ["tools/docs_site/src/phasor_docs_site"]
venvPath = "."
venv = ".venv"
